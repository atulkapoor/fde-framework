name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
        with:
          # The sanitisation suite scans history (git log --all); a
          # shallow clone would reduce that scan to one commit and
          # quietly hollow out the guarantee the README states.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "${{ matrix.python }}"
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest -q
      # Nothing supplied or researched may reach a public repo.
      - run: pytest tests/test_sanitisation.py -q

  # The installable surfaces: the plugin manifests and the skill, validated
  # by the client that installs them, without installing anything.
  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22"}
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin validate .claude-plugin/plugin.json
      - run: claude plugin validate skills
