# Publishes to PyPI on a version tag, via trusted publishing -- no token
# lives anywhere. One-time setup on PyPI first: add a "trusted publisher"
# for atulkapoor/fde-framework, workflow release.yml, environment pypi.
# Then `git tag v0.1.0 && git push origin v0.1.0` is the whole release.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,documents]"
      # One version, everywhere it is stated: the tag, pyproject.toml,
      # CITATION.cff and the newest CHANGELOG entry. A tag that disagrees is
      # refused here, before anything is built or published.
      - run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $version"; exit 1; }
          grep -q "^version: $version$" CITATION.cff || { echo "CITATION.cff != $version"; exit 1; }
          grep -m1 -E "^## \[[0-9]" CHANGELOG.md | grep -q "\[$version\]" || { echo "CHANGELOG newest entry != $version"; exit 1; }
      - run: ruff check src tests
      - run: pytest -q
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The Releases page is a public surface like PyPI's: tags without release
  # notes read as a project that stopped at whatever the last note says.
  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # The body is this version's CHANGELOG section, verbatim.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > body.md
          gh release create "$TAG" --title "$VERSION" --notes-file body.md

  # A stranger's install: the published wheel, not the checkout, into a
  # fresh interpreter, through the documented first five minutes -- triage,
  # start, next, the MCP check. The index lags a tag by a minute or two, so
  # the install retries before it concludes anything.
  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - name: Install the published wheel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            pip install --no-cache-dir "fde-framework[mcp]==$VERSION" && break
            sleep 30
          done
          python -c "import fde; print('installed', fde.__version__)"
      - name: The documented first five minutes
        run: |
          set -e
          cd "$(mktemp -d)"
          fde triage --statement "Route each inbound support message to one of 77 queues; customer data may not leave our cloud account." \
                     --statement "Answer staff questions from 400 policy PDFs inside the firewall." | grep "ranked by"
          fde start acme --statement "Route each support message to one of 77 queues." | grep -i acme
          fde next acme | grep "^next: fde "
          fde status acme | grep "blocked by"
          FDE_WORKSPACE="$PWD" fde mcp --check | grep "start      writes"
          fde doctor
