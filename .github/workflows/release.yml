# Publishes to PyPI on a version tag, via trusted publishing -- no token
# lives anywhere. One-time setup on PyPI first: add a "trusted publisher"
# for atulkapoor/fde-framework, workflow release.yml, environment pypi.
# Then `git tag v0.1.0 && git push origin v0.1.0` is the whole release.
name: release
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install -e ".[dev,documents]"
      # One version, everywhere it is stated: the tag, pyproject.toml,
      # CITATION.cff and the newest CHANGELOG entry. A tag that disagrees is
      # refused here, before anything is built or published. One date too:
      # the CHANGELOG's, CITATION.cff's, and the day the tagged commit was
      # authored, in the author's own time zone (0.1.44 went out dated a day
      # ahead, and an outside reader saw it before I did).
      - run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != pyproject $version"; exit 1; }
          grep -q "^version: $version$" CITATION.cff || { echo "CITATION.cff != $version"; exit 1; }
          grep -q "\"version\": \"$version\"" .claude-plugin/plugin.json || { echo "plugin.json != $version"; exit 1; }
          grep -m1 -E "^## \[[0-9]" CHANGELOG.md | grep -q "\[$version\]" || { echo "CHANGELOG newest entry != $version"; exit 1; }
          date=$(grep -m1 -E "^## \[$version\]" CHANGELOG.md | grep -oE "[0-9]{4}-[0-9]{2}-[0-9]{2}")
          grep -q "^date-released: '$date'$" CITATION.cff || { echo "CITATION.cff date-released != CHANGELOG's $date"; exit 1; }
          authored=$(git log -1 --format=%ad --date=iso HEAD | cut -c1-10)
          test "$date" = "$authored" || { echo "CHANGELOG dates $version $date; the tagged commit was authored $authored"; exit 1; }
      - run: ruff check src tests
      # The suite, with its counts and its skip reasons kept for the release
      # page: passed, failed and skipped stated separately, and a skip that
      # is a missing tool (docker, an extra) named as such, so a reader can
      # tell a product failure from a tool that was not there.
      - name: The suite, with a report for the release page
        run: |
          set -o pipefail
          pytest -q -rs | tee pytest.txt
          python - <<'PY'
          import collections, re
          text = open("pytest.txt").read()
          summary = [l for l in text.splitlines() if re.search(r"\d+ passed", l)][-1].strip()
          reasons = collections.Counter(
              m.group(1).strip() for m in re.finditer(r"^SKIPPED \[\d+\] [^:]+:\d+: (.*)$", text, re.M))
          with open("tests.md", "w") as f:
              f.write(f"Tests in this run, on Python 3.12: {summary}.")
              if reasons:
                  f.write(" Skipped, by reason:\n")
                  for why, n in reasons.most_common():
                      f.write(f"- {n}: {why}\n")
          print(open("tests.md").read())
          PY
      - uses: actions/upload-artifact@v4
        with: {name: tests, path: tests.md}
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v4
        with: {name: dist, path: dist/}

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: pypa/gh-action-pypi-publish@release/v1

  # The Releases page is a public surface like PyPI's: tags without release
  # notes read as a project that stopped at whatever the last note says.
  # A release page is written only after the published wheel has been
  # installed and walked on every supported Python (below), so its
  # existence means verified, not merely uploaded. It carries the files
  # that went to PyPI, their checksums, the commit they were built from and
  # the run whose tests they passed, so a reader can match the wheel they
  # installed to the code and the result.
  github-release:
    needs: [publish, verify-published]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: {name: dist, path: dist/}
      - uses: actions/download-artifact@v4
        with: {name: tests, path: tests/}
      - name: Create the GitHub release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          # The body is this version's CHANGELOG section, verbatim, then
          # what exactly this release is.
          awk -v ver="$VERSION" '
            $0 ~ "^## \\["ver"\\]" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > body.md
          {
            echo
            echo "---"
            cat tests/tests.md
            CI=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}" --jq '.workflow_runs[] | select(.name=="ci") | .html_url' | head -1)
            echo "The same commit's [CI run](${CI:-${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/workflows/ci.yml}) runs the suite on Python 3.11, 3.12 and 3.13 and validates the plugin."
            echo
            echo "Built from \`${GITHUB_SHA}\` in [run ${GITHUB_RUN_ID}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}): the tests ran against these files, they went to [PyPI](https://pypi.org/project/fde-framework/${VERSION}/), and the wheel PyPI serves was installed on Python 3.11, 3.12 and 3.13 and walked through [the first five minutes](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}#in-thirty-seconds) before this page was written. Install: \`pip install fde-framework==${VERSION}\`. SHA-256:"
            echo
            echo '```'
            (cd dist && sha256sum *)
            echo '```'
          } >> body.md
          gh release create "$TAG" --title "$VERSION" --notes-file body.md dist/*

  # A stranger's install: the published wheel, not the checkout, into a
  # fresh interpreter on each supported Python, through the documented
  # first five minutes -- triage, start, next, the MCP check, the doctor.
  # The wheel the index serves must hash to the wheel the tests ran
  # against. The index lags a tag by a minute or two, so the install
  # retries before it concludes anything.
  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - uses: actions/download-artifact@v4
        with: {name: dist, path: built/}
      - name: Install the published wheel
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for i in $(seq 1 20); do
            pip install --no-cache-dir "fde-framework[mcp]==$VERSION" && break
            sleep 30
          done
          python -c "import fde; print('installed', fde.__version__)"
      - name: The wheel the index serves is the wheel the tests ran against
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # The same lag as the install above: one mirror can answer the
          # install and another, seconds later, not yet list the version.
          for i in $(seq 1 20); do
            pip download --no-deps --no-cache-dir --only-binary :all: -d served "fde-framework==$VERSION" && break
            sleep 30
          done
          sha256sum built/*.whl served/*.whl
          test "$(sha256sum built/*.whl | cut -d' ' -f1)" = "$(sha256sum served/*.whl | cut -d' ' -f1)"
      - name: The documented first five minutes
        run: |
          set -e
          cd "$(mktemp -d)"
          fde triage --statement "Route each inbound support message to one of 77 queues; customer data may not leave our cloud account." \
                     --statement "Answer staff questions from 400 policy PDFs inside the firewall." | grep "ranked by"
          fde start acme --statement "Route each support message to one of 77 queues." | grep -i acme
          fde next acme | grep "^next: fde "
          fde status acme | grep "blocked by"
          FDE_WORKSPACE="$PWD" fde mcp --check | grep "start      writes"
          fde mcp --schema | python -c "import json, sys; s = json.load(sys.stdin); assert s['required'], s"
          fde doctor
