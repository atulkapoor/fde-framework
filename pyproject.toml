[project]
# Distribution name matches the repository and stays unique on any index;
# the import package and the CLI command remain the short `fde`.
name = "fde-framework"
version = "0.1.0"
description = "A framework for Forward Deployed Engineers: from problem statement to a deployable AI project, every decision traced to a fact."
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.11"
keywords = [
    "forward-deployed-engineer", "fde", "ai-engineering", "llm",
    "code-generation", "air-gapped", "on-premises", "evaluation",
    "client-engagements", "decision-engine",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "python-frontmatter>=1.1",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
# Document readers are optional: plain-text intake needs nothing, and an
# air-gapped install should not drag in what it will not use.
documents = ["pypdf>=4", "python-docx>=1"]
# The hosted-model path for `fde frame --reader llm`. The local path (vLLM or
# Ollama via --endpoint) is stdlib-only on purpose: the offline install must
# not grow a dependency.
llm = ["anthropic>=0.40"]
all = ["fde-framework[documents,llm]"]

[project.scripts]
fde = "fde.cli:app"

[project.urls]
Homepage = "https://github.com/atulkapoor/fde-framework"
Repository = "https://github.com/atulkapoor/fde-framework"
Issues = "https://github.com/atulkapoor/fde-framework/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The registry ships inside the wheel: a pip install with no source checkout
# still has the knowledge base. A local ./framework directory, when present,
# always outranks the packaged copy -- contributors edit the real one.
[tool.hatch.build.targets.wheel.force-include]
"framework" = "fde/framework"

[tool.hatch.build.targets.sdist]
include = ["src", "framework", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/fde"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
