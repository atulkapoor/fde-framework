<svg xmlns="http://www.w3.org/2000/svg" width="780" height="465" viewBox="0 0 780 465">
  <rect width="780" height="465" rx="10" fill="#0d1117" stroke="#30363d"/>
  <circle cx="22" cy="20" r="5.5" fill="#ff5f56"/>
  <circle cx="42" cy="20" r="5.5" fill="#ffbd2e"/>
  <circle cx="62" cy="20" r="5.5" fill="#27c93f"/>
  <text x="390" y="24" text-anchor="middle" font-family="SF Mono, Menlo, monospace" font-size="11" fill="#8b949e">fde -- from statement to system, with receipts</text>
  <text x="22" y="46" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3"><tspan fill="#ff7b72">$ </tspan>pip install fde-framework</text>
<text x="22" y="67" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3"><tspan fill="#ff7b72">$ </tspan>fde start acme --statement "Extract fields from supplier invoices."</text>
<text x="22" y="88" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3"><tspan fill="#ff7b72">$ </tspan>fde frame acme --text "500,000 scanned invoices arrive; data cannot leave;</text>
<text x="22" y="109" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3">    10,000 verified; a person is waiting; structured records out."</text>
<text x="22" y="130" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#9ea7b3">Here is what I took from that:</text>
<text x="22" y="151" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#7ee787">  - How many items in total: 500,000</text>
<text x="22" y="172" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#7ee787">  - What arrives, and in what form: scanned documents</text>
<text x="22" y="193" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#7ee787">  - Can client data leave their environment: cannot leave</text>
<text x="22" y="214" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#7ee787">  - Is a person waiting for the result: yes</text>
<text x="22" y="235" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#9ea7b3">worth asking next (fde ask acme --role &lt;who&gt;):</text>
<text x="22" y="256" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#7ee787">  - Who may use this -- one team, distinct roles, or anyone internal?</text>
<text x="22" y="277" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3"><tspan fill="#ff7b72">$ </tspan>fde architect acme</text>
<text x="22" y="298" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#79c0ff">topology on-prem   [82d56c303de52199]</text>
<text x="22" y="319" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#9ea7b3">  perception     ocr-pipeline        governance   boundary-and-audit</text>
<text x="22" y="340" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#9ea7b3">  representation deterministic       deployment   systemd-unit</text>
<text x="22" y="361" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#9ea7b3">  evaluation     field-match         + 3 more, every rejection cited</text>
<text x="22" y="382" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#e6edf3"><tspan fill="#ff7b72">$ </tspan>fde build acme --out project</text>
<text x="22" y="403" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#ffa657">refused: gates unsatisfied -- [hard] data_access: credentials have</text>
<text x="22" y="424" xml:space="preserve" font-family="SF Mono, Menlo, Consolas, monospace" font-size="12.5" fill="#ffa657">not been shown to work against real data. Promised access is not access.</text>
</svg>